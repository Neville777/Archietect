[package]
name = "architect"
version = "0.1.0"
edition = "2021"
description = "Architectural memory engine — answers 'does this concept already exist, what is canonical, and what is the evidence' for any codebase. Deterministic; AI is a client, never a component."

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
rayon = "1"
regex = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
anyhow = "1"
toml = "0.8"
notify = "6"
tiny_http = "0.12"

[profile.release]
lto = "thin"
