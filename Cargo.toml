[package]
name = "archietect"
version = "0.1.19"
edition = "2021"
description = "Architectural memory engine — answers 'does this concept already exist, what is canonical, and what is the evidence' for any codebase. Deterministic; AI is a client, never a component."
license-file = "LICENSE"
repository = "https://github.com/Neville777/Archietect"
homepage = "https://github.com/Neville777/Archietect"
readme = "README.md"
keywords = ["cli", "architecture", "static-analysis", "mcp", "codebase"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["validation/", "prototype/", ".claude/", ".cursor/"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
rayon = "1"
regex = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
anyhow = "1"
toml = "0.8"
notify = "6"
tiny_http = "0.12"
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }

# --- Tree-sitter Core & Grammars ---
tree-sitter = "0.20"
tree-sitter-rust = "0.20"
tree-sitter-python = "0.20"
tree-sitter-typescript = "0.20"
tree-sitter-javascript = "0.20"
tree-sitter-go = "0.20"
tree-sitter-java = "0.20"
tree-sitter-c-sharp = "0.20"
tree-sitter-ruby = "0.20"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
