<!-- archietect GUI v0 — a READ-ONLY client of the REST API, nothing more.
     No business logic, no architectural reasoning, no state of its own:
     every number on this page is a fetch of the same JSON the CLI and MCP
     return. GitHub Desktop is a client of git; this page is a client of
     the engine. Single file, no build step, vanilla JS. -->
<meta charset="utf-8">
<title>archietect</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0d1117; --bg-raised: #161b22; --bg-sunken: #010409;
    --border: #30363d; --border-muted: #21262d;
    --fg: #c9d1d9; --fg-bright: #e6edf3; --fg-muted: #8b949e;
    --accent: #58a6ff; --accent-dim: #1f6feb;
    --ok: #3fb950; --ok-bg: rgba(63,185,80,.12); --ok-border: rgba(63,185,80,.4);
    --warn: #d29922; --bad: #f85149;
    --radius: 8px; --radius-sm: 6px;
    --shadow: 0 4px 14px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  body { font: 14px/1.6 ui-monospace, "SF Mono", Consolas, monospace; background:var(--bg); color:var(--fg);
         max-width: 1100px; margin: 2rem auto; padding: 0 1rem 3rem; }

  header { padding-bottom: 1rem; margin-bottom: 1.2rem; border-bottom: 1px solid var(--border-muted); }
  h1 { font-size: 1.35rem; font-weight: 700; color:var(--fg-bright); margin: 0 0 .3rem; letter-spacing: -.01em; }
  h1 small { display:block; margin-top:.25rem; color:var(--fg-muted); font-weight:normal; font-size:.75rem; }
  h3 { font-size: .95rem; font-weight: 600; color: var(--fg-bright); margin: 1.4rem 0 .5rem;
       padding-bottom: .35rem; border-bottom: 1px solid var(--border-muted); }
  h3:first-child { margin-top: 0; }
  h3 .muted { font-weight: normal; font-size: .8rem; }

  input, button, select { font:inherit; background:var(--bg-raised); color:var(--fg); border:1px solid var(--border);
                  padding:.4rem .7rem; border-radius:var(--radius-sm); transition: border-color .12s, background .12s, color .12s; }
  input:focus, select:focus { outline:none; border-color:var(--accent); background: var(--bg-sunken); }
  button { cursor:pointer; }
  button:hover { border-color: var(--accent-dim); background:#1c2330; }
  button:active { transform: translateY(1px); }
  button.active { border-color:var(--accent); color:var(--accent); background: rgba(88,166,255,.08); }

  .toolbar { display:flex; align-items:center; gap:.6rem; flex-wrap:wrap; }
  .toolbar label { color: var(--fg-muted); font-size: .85rem; }

  #aiStatus { margin: .9rem 0; padding: .55rem .9rem; border-radius: var(--radius); border: 1px solid var(--border);
              background: var(--bg-raised); font-size: .85rem; display:flex; align-items:center; gap:.5rem;
              transition: background .2s, border-color .2s; }
  #aiStatus:empty { display:none; }
  #aiStatus.ai-active { background: var(--ok-bg); border-color: var(--ok-border); color: var(--fg-bright); }
  #aiStatus .dot { display:inline-block; width:.55rem; height:.55rem; border-radius:50%; flex-shrink:0; }
  #aiStatus .ai-help { margin-left:auto; color:var(--fg-muted); cursor:help; flex-shrink:0; }
  #aiStatus .ai-help:hover { color:var(--accent); }
  #aiStatus.ai-active .dot { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-bg); animation: pulse 2s ease-in-out infinite; }
  #aiStatus.ai-idle .dot, #aiStatus.ai-none .dot { background: var(--fg-muted); }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.4; } }

  nav { margin:0 0 1rem; padding-bottom:.7rem; border-bottom:1px solid var(--border-muted);
        display:flex; align-items:center; gap:.4rem; flex-wrap:wrap; }
  nav button { border-color: transparent; background: transparent; color: var(--fg-muted); font-weight: 500; }
  nav button:hover { color: var(--fg-bright); background: var(--bg-raised); border-color: var(--border); }
  nav button.active { color: var(--accent); background: rgba(88,166,255,.1); border-color: var(--border); }

  .card { background:var(--bg-raised); border:1px solid var(--border); border-radius:var(--radius);
          padding:1.1rem; margin:.6rem 0; overflow-x:auto; box-shadow: var(--shadow); }
  .stat-row { display:flex; flex-wrap:wrap; gap: 0; background:var(--bg-raised); border:1px solid var(--border);
              border-radius: var(--radius); overflow:hidden; margin-bottom: .6rem; }
  .stat { display:inline-block; margin-right:1.6rem; }
  .stat b { display:block; font-size:1.5rem; color:var(--fg-bright); }
  button.stat { all:unset; display:block; cursor:pointer; padding: .8rem 1.2rem; flex:1; min-width: 8rem;
                border-right: 1px solid var(--border-muted); transition: background .12s; }
  button.stat:last-child { border-right: none; }
  button.stat:hover { background: rgba(255,255,255,.03); }
  button.stat.active { background: rgba(88,166,255,.08); box-shadow: inset 0 -2px 0 var(--accent); }
  button.stat:hover b, button.stat.active b { color:var(--accent); }
  #statDetail:empty { display:none; }
  .warn { color:var(--warn); } .bad { color:var(--bad); } .ok { color:var(--ok); }
  table { border-collapse: collapse; width:100%; font-size: inherit; }
  td, th { text-align:left; padding:.5rem .6rem; border-bottom:1px solid var(--border-muted); vertical-align:top; }
  th { color:var(--fg-muted); font-weight:600; font-size:.78rem; text-transform:uppercase; letter-spacing:.03em; }
  tbody tr { transition: background .1s; }
  tbody tr:hover { background: rgba(255,255,255,.025); }
  tr:last-child td { border-bottom: none; }
  .muted { color:var(--fg-muted); } pre { white-space:pre-wrap; margin:0; }
  [data-concept], [data-client], [data-domain], [data-file], [data-decision], [data-project] { cursor:pointer; color: var(--accent);
    text-decoration:underline dotted; text-underline-offset:3px; text-decoration-color: rgba(88,166,255,.4); }
  [data-concept]:hover, [data-client]:hover, [data-domain]:hover, [data-file]:hover, [data-decision]:hover, [data-project]:hover {
    text-decoration-style: solid; text-decoration-color: var(--accent); }
  tr.inline-drill > td { background:var(--bg-sunken); border-bottom:1px solid var(--border); border-left: 2px solid var(--accent-dim); }
  li.inline-drill { list-style:none; margin:.2rem 0; }
</style>

<header>
  <h1>archietect <small>read-only client of the engine · every number is a REST fetch <span id="buildTag" style="color:var(--ok)">[build: root-error-fix-01]</span></small></h1>
</header>
<div id="errBox"></div>
<div class="toolbar">
  <label for="root">root</label>
  <input id="root" size="52" placeholder="/absolute/path/to/repo">
  <button onclick="setRoot()">load</button>
</div>
<div id="aiStatus"></div>
<nav>
  <button data-tab="projects" onclick="show('projects')" title="every registered project on this machine, with live AI activity — works with no root typed in">projects</button>
  <button data-tab="overview" class="active" onclick="show('overview')">overview</button>
  <button data-tab="timeline" onclick="show('timeline')">timeline</button>
  <button data-tab="drift" onclick="show('drift')">drift</button>
  <button data-tab="laws" onclick="show('laws')">laws</button>
  <button data-tab="memory" onclick="show('memory')" title="every file archietect currently holds facts for — persistent, not tied to an in-flight scan">memory</button>
  <button data-tab="query" onclick="show('query')" title="owner, impact, guard, plan, tour, verdicts, register, permissions, docker observe, documents/photos/messages scan — CLI/MCP-only elsewhere">query</button>
  <span id="timer" class="muted" style="margin-left:auto; align-self:center;"></span>
  <button id="reload" onclick="reload()" title="re-fetch the current tab">⟳ reload</button>
</nav>
<div id="out" class="card"><span class="muted">set a repository root above</span></div>

<script>
const $ = id => document.getElementById(id);
let tab = 'overview';
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

// ── Load ownership ──────────────────────────────────────────────────────
// One load (show()/reload() call) OWNS #out, #timer, the progress poll, and
// lastDoctor/openStat at a time. Two async paths can be in flight together
// — an auto-loaded root's scan still running when the user switches roots,
// a reload racing a tab click, A→B→C fired rapidly — and any of them can
// resolve in any order, successfully or with an error. AbortController
// alone doesn't cover this: an abort only stops an in-flight NETWORK
// request, but a request that already reached the server keeps running
// there regardless, and can still return a perfectly normal-looking
// response — which must be discarded exactly as an aborted one would be if
// a newer load has since started. So every async function that can touch
// that shared state takes the `gen` its caller was given by startLoad(),
// and MUST check `isCurrentLoad(gen)` immediately after its own await
// resolves — before touching ANY of that state, not only before the final
// #out write — and do nothing else if it's stale. That single check is
// what makes the UI correct regardless of arrival order; the AbortSignal
// passed alongside it is purely an optimization (stop wasted browser-side
// work), not what correctness depends on.
let loadGeneration = 0;
let currentAbort = null;
function startLoad(){
  if (currentAbort) currentAbort.abort();
  currentAbort = new AbortController();
  return { gen: ++loadGeneration, signal: currentAbort.signal };
}
function isCurrentLoad(gen){ return gen === loadGeneration; }

// The server answers `{scanning:true}` instead of queuing this request
// behind an already-in-flight scan of the same root (see rest.rs's
// try_lock doc — a blocking queue there piled up dozens of abandoned
// requests from repeated reload clicks). Retrying here, instead of
// surfacing that as an error, is what makes try_lock's fast-fail actually
// transparent to the caller: /scan-progress (already polling alongside
// this) is what shows real movement in the meantime; this loop just waits
// for the in-flight scan to finish, then gets the fresh, fast, cached
// answer. Stops retrying the moment its own signal is aborted — a
// superseded load must not keep looping forever.
async function api(ep, extra, signal){
  while (true) {
    let d;
    try {
      d = await fetch(`${ep}?root=${encodeURIComponent($('root').value)}${extra||''}`, { signal }).then(r => r.json());
    } catch (e) {
      return e.name === 'AbortError' ? { aborted: true } : { error: `fetch to ${ep} failed: ${e}` };
    }
    if (!d || !d.scanning) return d;
    await new Promise(resolve => setTimeout(resolve, 500));
    if (signal && signal.aborted) return { aborted: true };
  }
}
const t = ms => ms ? new Date(ms).toLocaleString() : '—';

function showErr(text){
  const b = document.createElement('div');
  b.style.cssText = 'background:#3d1418;color:#f85149;border:1px solid #f85149;padding:.6rem 1rem;margin:.6rem 0;border-radius:6px;white-space:pre-wrap;font-size:.85rem;';
  b.textContent = text;
  $('errBox').appendChild(b);
}
window.onerror = (msg, src, line, col) => showErr(`JS error: ${msg} (${src}:${line}:${col})`);
window.addEventListener('unhandledrejection', e => showErr(`unhandled promise rejection: ${e.reason}`));

// "projects" needs no root and is the landing tab when none is set (see
// the bottom of this script) — but typing a path into the box and hitting
// "load" is a request to see THAT root, not to stay on the picker that
// exists only for when you don't have a path in mind yet. Same landing
// tab loadProject() already uses.
function setRoot(){
  localStorage.setItem('arch_root', $('root').value);
  show(tab === 'projects' ? 'overview' : tab);
  refreshAiStatus();
}

function agoText(ms){
  const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
  if (s < 5) return 'just now';
  if (s < 60) return `${s}s ago`;
  const m = Math.round(s / 60);
  if (m < 60) return `${m}m ago`;
  const h = Math.round(m / 60);
  if (h < 24) return `${h}h ago`;
  return `${Math.round(h / 24)}d ago`;
}

// "an AI used this once" (mcp_client_connected, one per session) is not the
// same claim as "an AI is using this RIGHT NOW" — the first is a single old
// log line; the second needs a signal that decays. mcp.rs writes a
// mcp_client_active heartbeat roughly every 60s while a session keeps
// calling tools (see its own doc comment), so ACTIVE_MS a little over that
// is "still going" and anything older is "was here, isn't now". Lives
// outside the tab system entirely — visible and refreshing regardless of
// which tab is open, unlike everything in #out — so it polls on its own
// timer instead of participating in loadGeneration/isCurrentLoad at all; a
// stale response here just gets silently superseded by the next tick, the
// same tolerance any polling loop needs, not a correctness requirement.
const ACTIVE_MS = 90 * 1000;
let aiStatusTimer = null;
// Renders into #aiStatus AND sets its state class (ai-active/ai-idle/
// ai-none) — the class is what the pulsing dot, the green tint, and the
// whole "this is the thing to look at" visual weight actually key off of
// (see the #aiStatus rules in <style>). A plain muted one-line sentence
// was the actual complaint: this is a status light, not a footnote, so it
// needs to look like one — bordered, colored, sized to be seen without
// hunting for it, not indistinguishable from the rest of the page's prose.
// This banner shows what archietect has ITSELF observed (an MCP tool call
// landing) — it has no way to see, and no way to fix, an AI tool's own
// client-side connection to it. That distinction is exactly the gap a
// non-CLI user hits: the banner going idle/none doesn't tell them WHY, and
// the fix (reconnecting that tool's OWN MCP client) happens entirely on
// the AI tool's side, not here — there is nothing this page could put a
// button on that would do it. A plain-language hint via the native
// title="" tooltip (same mechanism nav's own tab buttons already use) is
// the honest amount of help to offer: explain the gap, name the one
// command this project's docs know about (Claude Code's /mcp), and stop
// short of pretending a "reconnect" button here could reach into another
// program's process.
const AI_HELP_HTML = `<span class="ai-help" title="This shows the last MCP tool call archietect itself has seen — it can't see or fix an AI tool's OWN connection to it. If you expect one to be connected but this says otherwise, that tool's MCP client may need reconnecting on ITS side: in Claude Code, run /mcp; in other tools, check their MCP/integrations settings.">ⓘ</span>`;
function setAiStatus(stateClass, html){
  const el = $('aiStatus');
  el.className = stateClass;
  el.innerHTML = html ? `${html} ${AI_HELP_HTML}` : '';
}
// Shared by the top banner (one root) and the projects tab (every known
// root at once) — both answer the exact same question, "what's the most
// recent mcp_client_connected/active signal in this event list," just for
// a different set of events. One implementation so the two views can never
// silently disagree about what "active" means.
function clientActivityFromEvents(events){
  const seen = {};
  for (const e of events) {
    if (e.kind !== 'mcp_client_connected' && e.kind !== 'mcp_client_active') continue;
    const prev = seen[e.concept];
    // `tools` is THIS event's own tools-since-last-heartbeat (mcp.rs
    // clears it after every write) — kept from whichever event is most
    // recent, same as ts_ms/version, not accumulated across events: "what
    // is it asking about" means recently, not a lifetime list.
    if (!prev || e.ts_ms > prev.ts_ms) {
      seen[e.concept] = { ts_ms: e.ts_ms, version: e.detail && e.detail.version, tools: (e.detail && e.detail.tools) || [] };
    }
  }
  return seen;
}
// What it's asking about is the honest, answerable version of "what does
// the AI see" — the full request/response JSON for every call is a much
// bigger feature (logging arbitrary-size payloads forever); which
// questions it's been asking is real signal without that cost.
const toolsText = c => c.tools && c.tools.length ? ` — asking about: <b>${c.tools.map(esc).join(', ')}</b>` : '';
function clientActivitySummary(seen){
  const names = Object.keys(seen).sort((a, b) => seen[b].ts_ms - seen[a].ts_ms);
  if (!names.length) {
    return { stateClass: 'ai-none', names, active: [] };
  }
  const now = Date.now();
  const active = names.filter(n => now - seen[n].ts_ms < ACTIVE_MS);
  return { stateClass: active.length ? 'ai-active' : 'ai-idle', names, active };
}
async function refreshAiStatus(){
  const root = $('root').value;
  if (!root) { setAiStatus('', ''); return; }
  const d = await fetch(`/history?root=${encodeURIComponent(root)}&limit=100`).then(r => r.json()).catch(() => null);
  if ($('root').value !== root) return; // root changed while this was in flight
  const seen = clientActivityFromEvents((d && d.events) || []);
  const { stateClass, names, active } = clientActivitySummary(seen);
  if (!names.length) {
    setAiStatus('ai-none', '<span class="dot"></span> <span class="muted">no AI has connected to this project yet</span>');
  } else if (active.length) {
    const label = active.map(n => `<b>${esc(n)}</b>${seen[n].version ? ' v' + esc(seen[n].version) : ''}${toolsText(seen[n])}`).join('; ');
    setAiStatus('ai-active', `<span class="dot"></span> ${label} — <b>using this right now</b>`);
  } else {
    const n = names[0];
    setAiStatus('ai-idle', `<span class="dot"></span> <span class="muted">last AI activity: ${esc(n)}${seen[n].version ? ' v' + esc(seen[n].version) : ''}, ${agoText(seen[n].ts_ms)}${toolsText(seen[n])}</span>`);
  }
}
function startAiStatusPolling(){
  if (aiStatusTimer) return;
  refreshAiStatus();
  aiStatusTimer = setInterval(refreshAiStatus, 15000);
}

let progressTimer = null;
// Separate from isCurrentLoad(gen): that answers "does this generation
// still own #out", which stays TRUE for the whole window between a load
// starting and the NEXT one starting — including the moment right after
// the load's own real content has already rendered. A `/scan-progress`
// poll already in flight when that happens (dispatched the instant
// startProgressPolling was called, same generation, nothing superseded it
// yet) can still resolve afterward and, since isCurrentLoad(gen) alone
// says nothing changed, overwrite the just-rendered real content with a
// stale "finishing up" — found live switching tabs mid-query: `/doctor`
// happened to resolve before that tab's own `/scan-progress` tick did,
// and the poll's late arrival clobbered the already-correct overview
// screen. clearInterval only stops FUTURE ticks; it does nothing about
// one already awaiting a response. This flag is what actually closes
// that window — poll() checks it fresh every time its own await resolves,
// not just once when it was dispatched.
let progressPollingActive = false;
function stopProgressPolling(){
  progressPollingActive = false;
  if (progressTimer){ clearInterval(progressTimer); progressTimer = null; }
}
// Flat relative paths -> a nested {dirs, files} tree, rendered as an
// indented <ul> — directories sorted before files, both alphabetical, so
// scanning order doesn't jump the list around on every poll.
function pathsToTree(paths){
  const root = { dirs: {}, files: [] };
  for (const p of paths){
    const parts = p.split('/');
    let node = root;
    for (let i = 0; i < parts.length; i++){
      if (i === parts.length - 1){
        node.files.push(parts[i]);
      } else {
        node.dirs[parts[i]] = node.dirs[parts[i]] || { dirs: {}, files: [] };
        node = node.dirs[parts[i]];
      }
    }
  }
  return root;
}
// `clickable` is only true for the memory tab's tree (stable, fully-scanned
// data worth exploring) — the scan-progress panel's done/remaining trees
// reuse this same renderer for a transient, still-changing list, where a
// per-file click has nothing settled yet to show. `prefix` rebuilds each
// leaf's full relative path (pathsToTree's tree only keeps the LAST path
// segment per node) since /file-concepts needs the real path, not a
// basename that collides across directories.
function renderTree(node, cls, clickable, prefix){
  prefix = prefix || '';
  const dirNames = Object.keys(node.dirs).sort();
  const files = [...node.files].sort();
  if (!dirNames.length && !files.length) return '';
  let html = '<ul style="margin:0; padding-left:1.1rem; list-style:none;">';
  for (const d of dirNames){
    html += `<li><span class="muted">${esc(d)}/</span>${renderTree(node.dirs[d], cls, clickable, `${prefix}${d}/`)}</li>`;
  }
  for (const f of files){
    const full = `${prefix}${f}`;
    const label = clickable ? `<span data-file="${esc(full)}">${esc(f)}</span>` : esc(f);
    html += `<li class="${cls}">${label}</li>`;
  }
  html += '</ul>';
  return html;
}

// Rebuilding #out's full innerHTML on every 400ms poll tick destroyed and
// recreated the scrollable done/remaining boxes each time, which resets
// scrollTop to 0 — found live: scrolling the list was impossible, it kept
// snapping back to the top. Fix: build the shell (with stable element IDs)
// ONCE per scan, then every subsequent tick only replaces the CONTENTS of
// the two scroll boxes, explicitly saving and restoring their scrollTop
// around that — innerHTML assignment resets an element's own scroll
// position too, not just its ancestors', so the save/restore is required
// even though these boxes themselves aren't being recreated.
function ensureProgressShell(){
  if ($('doneTreeBox')) return;
  $('out').innerHTML = `
    <div id="scanStatus" class="muted"></div>
    <div style="display:flex; gap:1rem; margin-top:.6rem;">
      <div style="flex:1; min-width:0;">
        <h3 class="ok" id="doneHeading"></h3>
        <div id="doneTreeBox" style="max-height:300px; overflow:auto;"></div>
      </div>
      <div style="flex:1; min-width:0;">
        <h3 id="remainingHeading"></h3>
        <div id="remainingTreeBox" style="max-height:300px; overflow:auto;"></div>
      </div>
    </div>`;
}
function setScrollPreserved(elId, html){
  const el = $(elId);
  const top = el.scrollTop;
  el.innerHTML = html;
  el.scrollTop = top;
}

// `started` is ONLY used for the done>=total branch below, not the
// percentage branch: ScanProgress (src/scan.rs) counts FILE·PASS units, not
// wall-clock work, and only covers the two per-file scan passes — the
// query itself (/duplicates' concept-pair comparison, /doctor's
// coverage_report, etc.) runs AFTER scan_with_prior returns and reports
// nothing back at all while it runs. Measured live: files 100% done, then
// nothing else changes on screen for 4-16+ seconds while that query
// finishes — a static "finishing up" string sitting unchanged for that
// whole time is indistinguishable from hung, which is exactly why it LOOKS
// stuck even on repos where it isn't. Showing elapsed time here (this tab's
// own #timer element already does, but it's easy to miss next to the small
// reload button while #out — the actual content area — holds your eye) is
// the honest fix given there is no real per-file signal for this phase to
// report; genuinely instrumenting each query's own progress is a bigger
// project-by-project effort than one UI fix covers.
function startProgressPolling(gen, signal, started){
  stopProgressPolling();
  progressPollingActive = true;
  const poll = async () => {
    const d = await api('/scan-progress', '', signal).catch(() => null);
    // Both checks are load-bearing, and check different things: isCurrentLoad
    // catches a NEWER load starting; progressPollingActive catches THIS
    // load already finishing (stopProgressPolling ran) before this one
    // in-flight request got its answer back — see progressPollingActive's
    // own doc comment for why isCurrentLoad alone misses that case.
    if (!progressPollingActive || !isCurrentLoad(gen)) return;
    if (!d || d.total == null || d.total === 0) return;
    if (d.done >= d.total) {
      $('out').innerHTML = `<span class="muted">loading… finishing up (${fmtDuration(performance.now() - started)} so far — the file scan is done; this is the query itself still running)</span>`;
      return;
    }
    const pct = Math.floor(100 * d.done / d.total);
    ensureProgressShell();
    $('scanStatus').textContent = `scanning… ${d.done} / ${d.total} files (${pct}%)`;
    $('doneHeading').innerHTML = `gone over <span class="muted">(${d.done_files_total} of last ${(d.done_files||[]).length} shown)</span>`;
    $('remainingHeading').innerHTML = `remaining <span class="muted">(${d.remaining_files_total} — first ${(d.remaining_files||[]).length} shown)</span>`;
    setScrollPreserved('doneTreeBox', renderTree(pathsToTree(d.done_files||[]), 'ok') || '<span class="muted">none yet</span>');
    setScrollPreserved('remainingTreeBox', renderTree(pathsToTree(d.remaining_files||[]), 'muted') || '<span class="muted">none</span>');
  };
  poll();
  progressTimer = setInterval(poll, 400);
}

function fmtDuration(ms){
  return ms < 1000 ? `${Math.round(ms)}ms` : `${(ms/1000).toFixed(1)}s`;
}

// A live, ticking "loading… Xs" while a load is in flight — not just a
// final "loaded in Xs" reported after the fact, which tells you nothing
// while you're the one sitting there watching a slow load with no number
// moving at all. Self-stops via the same isCurrentLoad(gen) check every
// other piece of load-owned state uses, so a superseded load's timer never
// keeps ticking over a newer load's own.
let liveTimer = null;
function stopLiveTimer(){
  if (liveTimer){ clearInterval(liveTimer); liveTimer = null; }
}
function startLiveTimer(gen, started){
  stopLiveTimer();
  liveTimer = setInterval(() => {
    if (!isCurrentLoad(gen)) { stopLiveTimer(); return; }
    $('timer').textContent = `loading… ${fmtDuration(performance.now() - started)}`;
  }, 250);
}

async function show(name){
  tab = name;
  document.querySelectorAll('nav button[data-tab]').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  // "projects" is the one tab that doesn't need a root — it's how you pick
  // one in the first place (loadProject() sets $('root').value and lands on
  // overview). Every other tab bails here exactly as before.
  if (!$('root').value && name !== 'projects') return;
  const { gen, signal } = startLoad();
  $('out').innerHTML = '<span class="muted">loading…</span>';
  $('timer').textContent = '';
  const started = performance.now();
  // "query" renders its own endpoint-picker form synchronously — there is
  // no scan in flight yet to poll for (that only starts once "run" is
  // clicked; see runQuery(), which starts its own polling/timer then).
  // Starting the poller here anyway would race its own first tick against
  // a render with no `await` in it at all, which the poller always wins
  // (any real fetch outlasts code that yields control to nothing) —
  // clobbering the freshly-rendered form the instant that first tick
  // resolves with whatever this root's scan progress happened to already
  // say (typically "done", left in place by an earlier tab's real scan;
  // see rest.rs's own doc on why a finished scan stays recorded).
  // "projects" never scans (system.db list + a plain /history read per
  // project, same as "query") — same race the query tab already documents
  // above: a synchronous render with no scan in flight loses to the
  // poller's first tick every time, so it's excluded the same way.
  if (name !== 'query' && name !== 'projects') {
    startProgressPolling(gen, signal, started);
    startLiveTimer(gen, started);
  }
  try {
    await ({overview, timeline, drift, laws, memory, query, projects})[name](gen, signal);
  } finally {
    // Only the load that's still current gets to stop polling/timer and
    // report a final time — see the "Load ownership" note above `startLoad`.
    if (isCurrentLoad(gen)) {
      stopProgressPolling();
      stopLiveTimer();
      $('timer').textContent = `loaded in ${fmtDuration(performance.now() - started)}`;
    }
  }
}

async function reload(){
  const btn = $('reload');
  if (btn.disabled) return;
  btn.disabled = true;
  const original = btn.textContent;
  btn.textContent = '⟳ reloading…';
  try { await show(tab); }
  finally { btn.disabled = false; btn.textContent = original; }
}

let lastDoctor = null;
let openStat = null;

async function overview(gen, signal){
  const d = await api('/doctor', '', signal);
  if (!isCurrentLoad(gen)) return; // stale — whether aborted, errored, or a normal late response
  if (d.error) return $('out').innerHTML = `<span class="bad">${esc(d.error)}</span>`;
  lastDoctor = d;
  openStat = null;
  lastDeclarationFiles = null; // per-load; don't reuse a previous load's snapshot
  const c = d.counts;
  const unusedPct = c.concepts ? Math.round(100 * d.declared_but_never_observed_in_use.length / c.concepts) : 0;
  // A number needs a sentence around it to say anything — "15 never
  // observed" told you a count exists, not whether that's fine (a young
  // repo, most things freshly declared) or a real problem (a fifth of
  // everything declared is dead weight). Same counts as the stat buttons
  // below, just read as a claim instead of five disconnected numbers.
  const headline = c.concepts
    ? `<p style="margin:0 0 .6rem;">${c.concepts} concept${c.concepts===1?'':'s'} declared across ${Object.keys(d.domains).length} domain${Object.keys(d.domains).length===1?'':'s'}, in ${c.files_scanned} scanned file${c.files_scanned===1?'':'s'}.${
        d.declared_but_never_observed_in_use.length
          ? ` <span class="warn">${d.declared_but_never_observed_in_use.length} (${unusedPct}%) are declared but never observed in use</span> — click "never observed" below to see which.`
          : ' None are declared-but-unused — everything declared has at least one observed use.'
      }</p>`
    : '';
  $('out').innerHTML = `
    ${headline}
    <div class="stat-row">
      <button class="stat" data-stat="concepts" onclick="toggleStat('concepts')"><b>${c.concepts}</b>concepts</button>
      <button class="stat" data-stat="files" onclick="toggleStat('files')"><b>${c.files_scanned}</b>files</button>
      <button class="stat" data-stat="decisions" onclick="toggleStat('decisions')"><b>${c.declared_decisions}</b>decisions</button>
      <button class="stat" data-stat="aliases" onclick="toggleStat('aliases')"><b>${c.declared_aliases}</b>aliases</button>
      <button class="stat" data-stat="unused" onclick="toggleStat('unused')"><b>${d.declared_but_never_observed_in_use.length}</b><span class="warn">never observed</span></button>
    </div>
    <div id="statDetail" class="card"></div>
    <h3>domains <span class="muted">(where declarations live, biggest first — click one to see its files)</span></h3>
    ${renderDomainsTable(d.domains)}
    <h3>top concepts <span class="muted">(by observed use — click one for its evidence)</span></h3>
    <table>${d.top_concepts.map(x=>`<tr><td><span data-concept="${esc(x.concept)}">${esc(x.concept)}</span></td><td>${x.observed_uses} uses</td></tr>`).join('')}</table>
    <h3>decisions to read <span class="muted">(click one for the reasoning and what was rejected)</span></h3>
    <table>${d.things_to_read.map(x=>`<tr><td><span data-decision="${esc(x.id)}">${esc(x.id)}</span></td><td class="muted">${esc(x.decision)}</td></tr>`).join('') || '<tr><td class="muted">none declared — archietect.toml [[decision]] entries appear here</td></tr>'}</table>`;
}

function renderDecisionCard(x){
  const rejected = (x.rejected||[]).map(r => `<li class="muted">${esc(r)}</li>`).join('');
  const links = (x.links||[]).map(l => `<span data-concept="${esc(l)}">${esc(l)}</span>`).join(', ');
  return `
    <div><b>${esc(x.id)}</b></div>
    <div style="margin-top:.3rem;">${esc(x.decision)}</div>
    ${x.because ? `<div class="muted" style="margin-top:.3rem;">because: ${esc(x.because)}</div>` : ''}
    ${rejected ? `<h3 style="margin:.5rem 0 .2rem;">rejected</h3><ul style="margin:0; padding-left:1.2rem;">${rejected}</ul>` : ''}
    ${links ? `<div class="muted" style="margin-top:.3rem;">links: ${links}</div>` : ''}
    ${x.proposed_by ? `<div class="muted" style="margin-top:.3rem;">proposed by: ${esc(x.proposed_by)}</div>` : ''}`;
}
function toggleDecisionDrill(el){
  const id = el.dataset.decision;
  const x = (lastDoctor && lastDoctor.things_to_read || []).find(t => t.id === id);
  return toggleInlineDrill(el, `decision:${id}`, async () => x ? renderDecisionCard(x) : `<div class="bad">decision '${esc(id)}' not found</div>`);
}

const STAT_RENDERERS = {
  concepts: d => `<h3>top concepts <span class="muted">(by observed use — click one for its evidence; full list needs \`archietect verdicts\`)</span></h3>
    <table>${d.top_concepts.map(x=>`<tr><td><span data-concept="${esc(x.concept)}">${esc(x.concept)}</span></td><td>${x.observed_uses} uses</td></tr>`).join('') || '<tr><td class="muted">none</td></tr>'}</table>`,
  files: d => `<h3>files by domain <span class="muted">(where declarations live — click one to see its files)</span></h3>
    ${renderDomainsTable(d.domains)}`,
  decisions: d => `<h3>decisions to read</h3>
    <table>${d.things_to_read.map(x=>`<tr><td><span data-decision="${esc(x.id)}">${esc(x.id)}</span></td><td class="muted">${esc(x.decision)}</td></tr>`).join('') || '<tr><td class="muted">none declared — archietect.toml [[decision]] entries appear here</td></tr>'}</table>`,
  // The alias key itself, not just its target, is clickable: query::concept
  // resolves a declared alias to its canonical concept before falling back
  // to name-token search (LAW-011), so `data-concept` on the alias works
  // the same way it does on a real concept name — same endpoint, same card.
  aliases: d => `<h3>declared aliases <span class="muted">(click either side for its evidence)</span></h3>
    <table>${(d.declared_aliases_list||[]).map(a=>`<tr><td><span data-concept="${esc(a.alias)}">${esc(a.alias)}</span></td><td class="muted">→ <span data-concept="${esc(a.target)}">${esc(a.target)}</span></td></tr>`).join('') || '<tr><td class="muted">none declared — archietect.toml [aliases] entries appear here</td></tr>'}</table>`,
  unused: d => `<h3 class="warn">declared but never observed in use <span class="muted">(click one to see where it's declared)</span></h3>
    <table>${d.declared_but_never_observed_in_use.map(n=>`<tr><td><span data-concept="${esc(n)}">${esc(n)}</span></td></tr>`).join('') || '<tr><td class="muted">none</td></tr>'}</table>`,
};

function toggleStat(kind){
  const opening = openStat !== kind;
  openStat = opening ? kind : null;
  document.querySelectorAll('#out > div > button.stat').forEach(b => b.classList.toggle('active', opening && b.dataset.stat === kind));
  $('statDetail').innerHTML = opening ? STAT_RENDERERS[kind](lastDoctor) : '';
}

// Every drill-down (concept/domain/file) expands INLINE, as a new row
// directly under the exact <tr> that was clicked — not into one shared,
// fixed-position div elsewhere on the page. Found live (Playwright,
// bounding boxes): clicking a concept ~490px down the page opened its
// detail panel at ~760px, past several unrelated sections — technically
// "working" but confusing enough to read as "nothing happened." One
// expansion open at a time, EXCEPT an expansion never removes its own
// ancestors — domain -> file -> concept nests three deep, and closing
// "everything else" must not delete the row the new content is about to be
// inserted under.
async function toggleInlineDrill(el, key, load){
  // Table rows (concept/domain/decision lists) and tree leaves (memory
  // tab's file tree, plain <li>s, no <table> in sight) both need a sibling
  // inserted right after the clicked element — same mechanism, two element
  // shapes, so the anchor's tag decides the wrapper without duplicating any
  // of the ownership/nesting logic below.
  const anchor = el.closest('tr, li');
  if (!anchor) return;
  const next = anchor.nextElementSibling;
  if (next && next.classList.contains('inline-drill') && next.dataset.key === key) {
    next.remove();
    return;
  }
  document.querySelectorAll('.inline-drill').forEach(r => { if (!r.contains(el)) r.remove(); });
  const gen = loadGeneration;
  const isRow = anchor.tagName === 'TR';
  const container = document.createElement(isRow ? 'tr' : 'li');
  container.className = 'inline-drill';
  container.dataset.key = key;
  let slot = container;
  if (isRow) {
    slot = document.createElement('td');
    slot.colSpan = anchor.children.length || 1;
    container.appendChild(slot);
  }
  slot.innerHTML = '<div class="card" style="margin:.3rem 0;"><span class="muted">loading…</span></div>';
  anchor.after(container);
  const html = await load();
  if (!isCurrentLoad(gen)) return;
  if (!container.isConnected) return; // closed, or superseded by another click, while this was loading
  slot.innerHTML = `<div class="card" style="margin:.3rem 0;">${html}</div>`;
}

// Domain names in the "domains" table are already a GROUPING of individual
// files (query.rs's top_segment — a monorepo container like crates/ is
// folded with its immediate subdir, e.g. "crates/titan_api", everything
// else by its own top-level dir). Reproduced here so a click can filter the
// full declaration_files list (from /status, fetched once per load and
// cached) down to exactly the files inside that domain — the actual code
// or data the count was summarizing, not just a number.
const DOMAIN_CONTAINERS = ['crates','packages','apps','bin','services','libs','modules'];
function topSegment(path){
  const parts = path.split('/');
  const first = parts[0] || 'root';
  if (DOMAIN_CONTAINERS.includes(first) && parts.length > 1) {
    return parts[1].includes('.') ? first : `${first}/${parts[1]}`;
  }
  return first;
}
// Sorted biggest-first, not alphabetical: a flat A-Z list put "actuators"
// (1 file) ahead of the domain actually carrying most of the repo, telling
// a reader nothing about where the weight of the codebase actually is —
// exactly the "just a list, communicates nothing" complaint this fixes.
// The percentage bar is the same idea again: 129 next to 1 says more as
// "41% of declaration files" than as two bare integers a reader has to
// mentally divide themselves.
function renderDomainsTable(domains){
  const entries = Object.entries(domains).sort((a, b) => b[1] - a[1]);
  const total = entries.reduce((sum, [, v]) => sum + v, 0) || 1;
  return `<table>${entries.map(([k,v]) => {
    const pct = Math.round(100 * v / total);
    return `<tr><td><span data-domain="${esc(k)}">${esc(k)}</span></td><td>${v} declaration file${v===1?'':'s'}</td><td class="muted">${pct}%</td></tr>`;
  }).join('') || '<tr><td class="muted">none</td></tr>'}</table>`;
}
// /declaration-files, not /status — /status also runs coverage_report's
// live directory walk plus git/docker sections, none of which this needs;
// on a large repo that made the domain drill-down look stuck on "loading…"
// for something that should be instant, since idx.declaration_files is
// already computed as part of the normal scan either way.
let lastDeclarationFiles = null;
function toggleDomainDrill(el){
  const domain = el.dataset.domain;
  return toggleInlineDrill(el, `domain:${domain}`, async () => {
    if (!lastDeclarationFiles) {
      // &peek=1: this drill-down only ever opens after the overview tab
      // already scanned this exact root — answer from that warm cache
      // instead of paying the same scan cost a second time. See rest.rs's
      // module doc ("## ?peek=1") for why this is a generic flag now,
      // not a one-off endpoint.
      lastDeclarationFiles = await api('/declaration-files', '&peek=1', currentAbort ? currentAbort.signal : undefined);
    }
    const s = lastDeclarationFiles;
    if (s.error) return `<div class="bad">${esc(s.error)}</div>`;
    const files = (s.declaration_files || []).filter(([f]) => topSegment(f) === domain);
    return `<h3 style="margin-top:0;">${esc(domain)} <span class="muted">(${files.length} declaration files — click one to see what it declares)</span></h3>
      <table>${files.map(([f,kind]) => `<tr><td><span data-file="${esc(f)}">${esc(f)}</span></td><td class="muted">${esc(kind)}</td></tr>`).join('') || '<tr><td class="muted">none</td></tr>'}</table>`;
  });
}

function toggleFileDrill(el){
  const file = el.dataset.file;
  return toggleInlineDrill(el, `file:${file}`, async () => {
    const d = await api('/file-concepts', `&file=${encodeURIComponent(file)}&peek=1`, currentAbort ? currentAbort.signal : undefined);
    if (d.error) return `<div class="bad">${esc(d.error)}</div>`;
    const concepts = d.concepts || [];
    return `<h3 style="margin-top:0;">${esc(file)} <span class="muted">(${concepts.length} concepts declared here — click one for its exact line and code)</span></h3>
      <table>${concepts.map(c => `<tr><td><span data-concept="${esc(c.name)}">${esc(c.name)}</span></td><td class="muted">${esc((c.kinds||[]).join(', '))}</td></tr>`).join('') || '<tr><td class="muted">none</td></tr>'}</table>`;
  });
}

// Shared by any tab that lists concept names (timeline's event rows,
// drift's duplicate/alias pairs) — clicking one drills into the SAME
// /concept endpoint the CLI's `archietect concept X` and the README's own
// demo use, showing real evidence instead of leaving the user to go run
// that command themselves. Reads loadGeneration/currentAbort directly
// (like isCurrentLoad already does) instead of threading gen/signal through
// inline onclick strings, which can't close over a render function's local
// variables anyway.
function renderConceptCard(d){
  if (d.error) return `<div class="bad">${esc(d.error)}</div>`;
  const verdictClass = d.verdict === 'ABSENT' ? 'bad' : (d.verdict === 'DECLARED_ONLY' || d.verdict === 'UNKNOWN' ? 'warn' : 'ok');
  const evidenceRows = (d.evidence||[]).map(e => `<tr><td class="muted">${esc(e.tier)}</td><td>${esc(e.what)}</td></tr>`).join('');
  const usedBy = (d.used_by_files||[]).map(f => `<li class="muted">${esc(f)}</li>`).join('');
  const competing = (d.competing||[]).length ? `<div class="warn" style="margin-top:.4rem;">competing: ${d.competing.map(esc).join(', ')}</div>` : '';
  // "Where is it actually declared" — the real file:line + real code read
  // fresh off disk (README's own demo output), not just the one-line
  // "what" summary in `evidence` above. This was fetched by /concept all
  // along; it just was never rendered.
  const sources = (d.source||[]).map(s => `
    <div class="muted" style="margin-top:.3rem;">${esc(s.file)}:${s.line}</div>
    <pre style="background:#0d1117; border:1px solid #21262d; border-radius:6px; padding:.5rem; overflow-x:auto;">${esc(s.excerpt)}</pre>`).join('');
  return `
    <div><b>${esc(d.canonical || d.concept)}</b> <span class="${verdictClass}">${esc(d.verdict||'')}</span> <span class="muted">${esc(d.confidence||'')}</span></div>
    ${d.recommendation ? `<div class="muted" style="margin-top:.3rem;">${esc(d.recommendation)}</div>` : ''}
    ${competing}
    ${evidenceRows ? `<h3 style="margin:.5rem 0 .2rem;">evidence</h3><table>${evidenceRows}</table>` : ''}
    ${sources ? `<h3 style="margin:.5rem 0 .2rem;">declared here</h3>${sources}` : ''}
    ${usedBy ? `<h3 style="margin:.5rem 0 .2rem;">used by</h3><ul style="margin:0; padding-left:1.2rem;">${usedBy}</ul>` : ''}`;
}
function toggleConceptDrill(el){
  const name = el.dataset.concept;
  return toggleInlineDrill(el, `concept:${name}`, async () => {
    // &peek=1 — this is a click nested inside an already-open tab, not a
    // fresh lookup; see rest.rs's "## ?peek=1" doc. Without it, the nested
    // domain→file→concept click chain each paid a full incremental rescan,
    // which is what "stuck on loading" on the innermost click actually was.
    const d = await api('/concept', `&q=${encodeURIComponent(name)}&peek=1`, currentAbort ? currentAbort.signal : undefined);
    return renderConceptCard(d);
  });
}
// #out itself is never replaced (only its innerHTML), so one delegated
// listener set up once at script load covers every re-render of every tab —
// no need to re-attach after each innerHTML assignment.
$('out').addEventListener('click', e => {
  const c = e.target.closest('[data-concept]');
  if (c) { toggleConceptDrill(c); return; }
  const cl = e.target.closest('[data-client]');
  if (cl) { toggleClientFilter(cl.dataset.client); return; }
  const dm = e.target.closest('[data-domain]');
  if (dm) { toggleDomainDrill(dm); return; }
  const fl = e.target.closest('[data-file]');
  if (fl) { toggleFileDrill(fl); return; }
  const dc = e.target.closest('[data-decision]');
  if (dc) { toggleDecisionDrill(dc); return; }
  const pr = e.target.closest('[data-project]');
  if (pr) loadProject(pr.dataset.project);
});
// Picking a project from the projects tab is the whole point of that tab
// existing — replaces typing a path by hand. Lands on overview, the same
// tab a fresh `archietect gui /path` launch lands on, not back on
// "projects" (which would just show the same picker again).
function loadProject(root){
  $('root').value = root;
  localStorage.setItem('arch_root', root);
  show('overview');
  refreshAiStatus();
}

let clientFilter = null;
function toggleClientFilter(name){
  clientFilter = clientFilter === name ? null : name;
  renderTimelineTable();
}
function renderTimelineTable(){
  const box = $('timelineEvents');
  if (!box) return;
  // mcp_client_active is plumbing for the "is an AI active right now"
  // signal (see refreshAiStatus/aiStatus banner and mcp.rs's own doc on
  // why it exists at all), not narrative history — a long session calling
  // tools every few seconds would otherwise flood this table with a
  // heartbeat every ~60s and push the real architectural events (the
  // entire point of this tab) out of the visible window.
  const baseEvents = lastTimelineEvents.filter(e => e.kind !== 'mcp_client_active');
  const events = clientFilter ? baseEvents.filter(e => e.concept === clientFilter) : baseEvents;
  const filterBar = clientFilter
    ? `<div class="muted" style="margin-bottom:.4rem;">showing only <b>${esc(clientFilter)}</b> — <span data-client="${esc(clientFilter)}" style="text-decoration:underline;">clear filter</span></div>`
    : '';
  const rows = events.map(e => {
    const isClient = e.kind === 'mcp_client_connected';
    const tools = e.detail && e.detail.tools;
    const detailText = isClient
      ? `connected via MCP${e.detail && e.detail.version ? ' — v' + esc(e.detail.version) : ''}${tools && tools.length ? ' — asked about: ' + tools.map(esc).join(', ') : ''}`
      : esc(JSON.stringify(e.detail).slice(0,180));
    const conceptCell = isClient
      ? `<span data-client="${esc(e.concept)}">${esc(e.concept)}</span>`
      : `<span data-concept="${esc(e.concept)}">${esc(e.concept)}</span>`;
    return `<tr>
      <td class="muted">${t(e.ts_ms)}</td>
      <td class="${e.kind.includes('duplicate')||e.kind.includes('lost')?'warn':'ok'}">${esc(e.kind)}</td>
      <td>${conceptCell}</td>
      <td class="muted"><pre>${detailText}</pre></td></tr>`;
  }).join('');
  box.innerHTML = `${filterBar}<table><tr><th>when</th><th>event</th><th>concept</th><th>detail</th></tr>${rows ||
    '<tr><td colspan=4 class="muted">no events yet — run `archietect watch --root …` and history accumulates</td></tr>'}</table>`;
}

let lastTimelineEvents = [];
async function timeline(gen, signal){
  const d = await api('/history', '&limit=60', signal);
  if (!isCurrentLoad(gen)) return;
  if (d.error) return $('out').innerHTML = `<span class="bad">${esc(d.error)}</span>`;
  const events = d.events || [];

  // "How do I know an AI is using this, and which one" — answered directly,
  // at the top, from the same mcp_client_connected events every real MCP
  // client's `initialize` handshake now records (see mcp.rs) — not buried
  // as one more row in the raw table below.
  const clientsSeen = {};
  for (const e of events) {
    if (e.kind !== 'mcp_client_connected' && e.kind !== 'mcp_client_active') continue;
    const prev = clientsSeen[e.concept];
    if (!prev || e.ts_ms > prev.ts_ms) {
      clientsSeen[e.concept] = { ts_ms: e.ts_ms, version: e.detail && e.detail.version, tools: (e.detail && e.detail.tools) || [] };
    }
  }
  const clientNames = Object.keys(clientsSeen).sort((a,b) => clientsSeen[b].ts_ms - clientsSeen[a].ts_ms);
  const clientsSummary = clientNames.length
    ? `<h3 class="ok">AI clients seen on this project <span class="muted">(click one to filter the timeline below)</span></h3>
       <table>${clientNames.map(name => `<tr><td><b><span data-client="${esc(name)}">${esc(name)}</span></b></td><td class="muted">v${esc(clientsSeen[name].version || '?')}</td><td class="muted">last seen ${t(clientsSeen[name].ts_ms)}</td><td class="muted">${(clientsSeen[name].tools||[]).map(esc).join(', ') || '—'}</td></tr>`).join('')}</table>`
    : `<div class="muted">no MCP client has connected to this project yet — an AI tool calling \`archietect mcp\` records itself here on its first tool call.</div>`;

  lastTimelineEvents = events;
  clientFilter = null;
  $('out').innerHTML = `
    ${clientsSummary}
    <h3>architectural timeline <span class="muted">(append-only — click a concept for its evidence)</span></h3>
    <div id="timelineEvents"></div>`;
  renderTimelineTable();
}

async function drift(gen, signal){
  const d = await api('/duplicates', '', signal);
  if (!isCurrentLoad(gen)) return;
  if (d.error) return $('out').innerHTML = `<span class="bad">${esc(d.error)}</span>`;
  const pairLinks = names => names.map(c => `<span data-concept="${esc(c)}">${esc(c)}</span>`).join(' ↔ ');
  $('out').innerHTML = `
    <h3 class="warn">likely same concept, needs alias <span class="muted">(one-line archietect.toml fix — click a concept for its evidence)</span></h3>
    <table>${(d.likely_same_concept_needs_alias||[]).map(p=>`<tr><td>${pairLinks(p.concepts)}</td></tr>`).join('') || '<tr><td class="muted">none</td></tr>'}</table>
    <h3>suspected duplicates <span class="muted">(name overlap = risk, not proof)</span></h3>
    <table>${(d.suspected_duplicates||[]).map(p=>`<tr><td>${pairLinks(p.concepts)}</td><td class="muted">via ${esc(p.shared_token)}</td></tr>`).join('') || '<tr><td class="muted">none</td></tr>'}</table>`;
}

async function laws(gen, signal){
  const d = await fetch('/laws', { signal })
    .then(r=>r.json())
    .catch(e => e.name === 'AbortError' ? { aborted: true } : { error: `fetch to /laws failed: ${e}` });
  if (!isCurrentLoad(gen)) return;
  if (d.error) return $('out').innerHTML = `<span class="bad">${esc(d.error)}</span>`;
  $('out').innerHTML = `
    <div><span class="stat"><b>${d.stats.laws_active}</b>active laws</span>
    <span class="stat"><b>${d.stats.corpus_repositories}</b>corpus repos</span>
    <span class="stat"><b>v${d.stats.extractor_version}</b>extractor</span></div>
    <table><tr><th>law</th><th>statement</th></tr>
    ${d.laws.map(l=>`<tr><td>${esc(l.id)}</td><td>${esc(l.statement)}</td></tr>`).join('')}</table>`;

// The only tab that works with NO root typed in at all — see show()'s own
// exception for it — because its entire point is answering "which project
// do I even want to look at" before a root is chosen. Registration is
// automatic now (mcp.rs registers a root into system.db on an AI's first
// real contact with it, the same gate as mcp_client_connected), so a
// project worked on via any real MCP client shows up here without anyone
// having to remember a separate `system register` step.
async function projects(gen, signal){
  const d = await fetch('/system/list', { signal }).then(r => r.json()).catch(e =>
    e.name === 'AbortError' ? { aborted: true } : { error: `fetch to /system/list failed: ${e}` });
  if (!isCurrentLoad(gen)) return;
  if (d.aborted) return;
  if (d.error) return $('out').innerHTML = `<span class="bad">${esc(d.error)}</span>`;
  const list = d.projects || [];
  if (!list.length) {
    $('out').innerHTML = `<h3>known projects</h3>
      <p class="muted">none registered yet — a project appears here automatically the first time an AI tool calls this server against it, or after running <code>archietect system register</code> / onboarding.</p>`;
    return;
  }
  // One /history call per known project, in parallel — each is a plain
  // event-log read (no scan, see rest.rs's INDEX_ENDPOINTS split), so this
  // stays cheap even with a handful of projects registered.
  const histories = await Promise.all(list.map(p =>
    fetch(`/history?root=${encodeURIComponent(p.root)}&limit=100`, { signal }).then(r => r.json()).catch(() => ({ events: [] }))
  ));
  if (!isCurrentLoad(gen)) return;
  const rows = list.map((p, i) => {
    const seen = clientActivityFromEvents((histories[i] && histories[i].events) || []);
    const { stateClass, names, active } = clientActivitySummary(seen);
    const badge = stateClass === 'ai-active'
      ? `<span class="ok">● ${active.map(esc).join(', ')} — active now</span>`
      : stateClass === 'ai-idle'
        ? `<span class="muted">○ ${esc(names[0])}, ${agoText(seen[names[0]].ts_ms)}</span>`
        : `<span class="muted">— no AI activity seen</span>`;
    return `<tr>
      <td><span data-project="${esc(p.root)}"><b>${esc(p.name)}</b></span></td>
      <td class="muted">${esc(p.root)}</td>
      <td>${badge}</td>
    </tr>`;
  }).join('');
  $('out').innerHTML = `
    <h3>known projects <span class="muted">(click one to load it — no path typing needed)</span></h3>
    <table><tr><th>project</th><th>root</th><th>AI activity</th></tr>${rows}</table>`;
}

async function memory(gen, signal){
  // &peek=1 — this tab's whole point is "whatever's known right now, scan
  // running or not" (see its own heading below), never a trigger to scan.
  const d = await api('/known-files', '&peek=1', signal);
  if (!isCurrentLoad(gen)) return;
  if (d.error) return $('out').innerHTML = `<span class="bad">${esc(d.error)}</span>`;
  const files = d.files || [];
  const tree = renderTree(pathsToTree(files), 'ok', true) || '<span class="muted">nothing known yet — load a tab first</span>';
  $('out').innerHTML = `
    <h3>known files <span class="muted">(${files.length} — everything this warm index currently holds facts for, whether or not a scan is running right now — click one to see what it declares)</span></h3>
    <div style="max-height:500px; overflow:auto;">${tree}</div>`;
}

// Every endpoint below is otherwise CLI/MCP-only — no dedicated tab renders
// any of them, and giving each one its own bespoke view is a lot of UI for
// data nobody's asked to browse yet. This tab is the minimum real bar
// instead: pick one, run it, read the actual JSON — better than "you can't
// see this from the GUI at all". `param: null` disables the argument box
// for endpoints that take none.
const QUERY_ENDPOINTS = {
  'owner':          { ep: '/owner',          param: 'q',   placeholder: 'concept or term' },
  'impact':         { ep: '/impact',         param: 'q',   placeholder: 'concept or term' },
  'guard':          { ep: '/guard',          param: 'sql', placeholder: 'CREATE TABLE ...' },
  'plan':           { ep: '/plan',           param: 'q',   placeholder: 'goal, e.g. add invoicing' },
  'tour':           { ep: '/tour',           param: null },
  'verdicts':       { ep: '/verdicts',       param: null },
  'register':       { ep: '/register',       param: null },
  'permissions':    { ep: '/permissions',    param: null },
  'docker observe': { ep: '/docker/observe', param: null },
  'documents scan': { ep: '/documents/scan', param: 'dir', placeholder: '/absolute/path to scan' },
  'photos scan':    { ep: '/photos/scan',    param: 'dir', placeholder: '/absolute/path to scan' },
  'messages scan':  { ep: '/messages/scan',  param: null },
};

function updateQueryPlaceholder(){
  const spec = QUERY_ENDPOINTS[$('queryEndpoint').value];
  const input = $('queryArg');
  input.disabled = !spec.param;
  input.placeholder = spec.param ? spec.placeholder : '(no argument needed)';
  if (!spec.param) input.value = '';
}

// This tab's own #out just holds the picker — nothing to fetch until the
// user picks an endpoint and clicks run, unlike every other tab here.
async function query(gen, signal){
  const opts = Object.keys(QUERY_ENDPOINTS).map(k => `<option value="${esc(k)}">${esc(k)}</option>`).join('');
  $('out').innerHTML = `
    <h3>run a query <span class="muted">(every endpoint below is CLI/MCP-only elsewhere — this reads the raw JSON straight back)</span></h3>
    <div><select id="queryEndpoint" onchange="updateQueryPlaceholder()">${opts}</select>
    <input id="queryArg" size="40"> <button onclick="runQuery()">run</button></div>
    <div id="queryResult" class="card" style="margin-top:.6rem;"></div>`;
  updateQueryPlaceholder();
}

// Triggered by the "run" button, not a tab switch — same
// startLoad/isCurrentLoad contract show() itself uses (see the "Load
// ownership" note near the top of this file), just entered from a button
// instead of nav, since most of QUERY_ENDPOINTS (owner/impact/guard/plan/
// tour/verdicts/register) are real INDEX_ENDPOINTS that scan like any
// other tab load — they deserve the same progress bar and live timer any
// other tab-triggered scan gets, not a bare "loading…" with no feedback.
async function runQuery(){
  const spec = QUERY_ENDPOINTS[$('queryEndpoint').value];
  const arg = $('queryArg').value.trim();
  const { gen, signal } = startLoad();
  const resultEl = $('queryResult');
  resultEl.innerHTML = '<span class="muted">loading…</span>';
  $('timer').textContent = '';
  const started = performance.now();
  // NOT startProgressPolling(): it unconditionally replaces the WHOLE
  // #out on every tick (every other tab's own render does too, so
  // whichever wins is still self-consistent) — this tab keeps the picker
  // form persistent and only updates the nested #queryResult div, so a
  // poll tick winning the race would wipe out the form along with it, not
  // just the stale result. The live timer writes to the separate #timer
  // element instead, which has no such conflict, and is real feedback on
  // its own for a single ad-hoc lookup like this.
  startLiveTimer(gen, started);
  try {
    const extra = spec.param && arg ? `&${spec.param}=${encodeURIComponent(arg)}` : '';
    const d = await api(spec.ep, extra, signal);
    if (!isCurrentLoad(gen)) return; // superseded — another run/tab switch owns #out now
    resultEl.innerHTML = d.error
      ? `<span class="bad">${esc(d.error)}</span>`
      : `<pre>${esc(JSON.stringify(d, null, 2))}</pre>`;
  } finally {
    if (isCurrentLoad(gen)) {
      stopLiveTimer();
      $('timer').textContent = `loaded in ${fmtDuration(performance.now() - started)}`;
    }
  }
}

// A ?root= query param (set by `archietect gui /path/to/project`) wins
// over whatever was last typed in manually — a fresh launch pointed at a
// specific project should show THAT project, not silently fall back to
// whatever this browser profile last had open.
const urlRoot = new URLSearchParams(location.search).get('root');
$('root').value = urlRoot || localStorage.getItem('arch_root') || '';
if (urlRoot) localStorage.setItem('arch_root', urlRoot);
// No root yet on a fresh launch (no ?root=, nothing remembered from last
// time) — land on the projects picker instead of a bare "set a repository
// root above" placeholder with nothing to click. A remembered/passed root
// still goes straight to overview, unchanged.
show($('root').value ? 'overview' : 'projects');
startAiStatusPolling();
</script>
