# The validation corpus — repositories the engine has been run against,
# with what each one contributed. The corpus taught the laws; the fixtures
# preserve the lessons. Grown deliberately: every new ecosystem is a session
# of running the loop (test → wrong answer → law → regression), not new
# machinery.

