# law-004 — part of Architect's language specification.
# Laws are amended, not edited: a superseded law gets status = "superseded"
# and a supersedes pointer from its successor — semantics are versioned.

id = "law-004"
title = "Exact-name match outranks token match"
statement = "When ranking canonical candidates, a concept whose full name matches the queried term outranks token matches regardless of usage counts."
because = "umami: 'website' returned WebsiteEvent (more usage) while a model literally named Website sat in the schema. The thing named for the concept IS the concept; heavier neighbours are still neighbours."
discovered_in = ["umami"]
introduced = "2026-08-05"
status = "active"
category = "ranking"
# ranking — this principle is now encoded as scoring::EXACT_NAME = 10_000
# in src/scoring.rs, which structurally outranks any usage+relation score.
# The regression fixture stays; the constant in scoring.rs IS this rule.
# Future ranking wrong answers tune a constant, not a new law.
