# law-015 — part of Architect's language specification.

id = "law-015"
title = "Insufficient structural coverage must never yield a confident ABSENT"
statement = "Architect must not claim a concept is ABSENT with high confidence when part of the repository is in a language it has no way to see into. Absence of evidence in a blind spot is not evidence of absence — that gap must be surfaced as a structured, provisional INSUFFICIENT_COVERAGE finding, exactly like a language on the known-unsupported list, never silently collapsed into a bare ABSENT."
mechanism = "A live, cheap (extension-only, no content reads) filesystem walk — `scan::unclassified_files` — for anything neither a recognized `structural::LANGUAGES` entry nor a known non-code format, checked by both `query::concept()`'s ABSENT path and `structural::coverage_report()`. This is today's enforcement, not the law itself: if the coverage model changes shape later (a different registry, a real parser, whatever), this law still holds and only the mechanism needs to change to match it."
because = "Found 2026-09-01 immediately after promoting every language on the KNOWN_UNSUPPORTED list (Swift, Objective-C, C/C++, Scala, Dart, Haskell, Clojure) to a real extractor, which left that table empty. The INSUFFICIENT_COVERAGE mechanism (added the same day to fix the identical failure mode) checked ONLY that now-empty table, so it silently stopped firing for anything it hadn't already been told about — verified live with a synthetic Lua file: `architect concept processOrder` returned files_scanned=0 and a flat ABSENT at 'high — no declaration, no observed usage, no name resemblance' confidence, the exact overclaiming this whole engine exists to prevent. A safety mechanism keyed to a hand-maintained list that can reach zero entries is not actually a safety mechanism once it does — this is the invariant that mechanism was always supposed to enforce, now stated independently of it."
category = "constraint"
discovered_in = ["architect's own repo — dogfooding the v0.1.0 release binary against a synthetic Lua fixture during a 'test it as a stranger would' pass"]
introduced = "2026-09-01"
status = "active"
regression = "tests/laws.rs::law_015_unclassified_language_yields_insufficient_coverage (fixture: tests/fixtures/law_015)"
