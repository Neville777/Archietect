# law-015 — part of Architect's language specification.

id = "law-015"
title = "A language nobody has classified at all must yield INSUFFICIENT_COVERAGE, never a confident ABSENT"
statement = "Before `concept()` returns ABSENT, or `coverage_report()` omits a language from its output, the engine must check for files whose extension is neither a recognized `structural::LANGUAGES` entry nor a known non-code format — via a live, extension-only filesystem walk (`scan::unclassified_files`), not only against the `structural::KNOWN_UNSUPPORTED` table. A repository containing a language nobody has ever classified must report a structured, provisional gap, exactly like a language on the KNOWN_UNSUPPORTED list does — never a flat, high-confidence ABSENT with zero indication anything was missed."
because = "Found 2026-09-01 immediately after promoting every language on the KNOWN_UNSUPPORTED list (Swift, Objective-C, C/C++, Scala, Dart, Haskell, Clojure) to a real extractor, which left that table empty. The INSUFFICIENT_COVERAGE mechanism (added the same day to fix the identical failure mode) checked ONLY that now-empty table, so it silently stopped firing for anything it hadn't already been told about — verified live with a synthetic Lua file: `architect concept processOrder` returned files_scanned=0 and a flat ABSENT at 'high — no declaration, no observed usage, no name resemblance' confidence, the exact overclaiming this whole engine exists to prevent. A safety mechanism keyed to a hand-maintained list that can reach zero entries is not actually a safety mechanism once it does."
category = "constraint"
discovered_in = ["architect's own repo — dogfooding the v0.1.0 release binary against a synthetic Lua fixture during a 'test it as a stranger would' pass"]
introduced = "2026-09-01"
status = "active"
regression = "tests/laws.rs::law_015_unclassified_language_yields_insufficient_coverage (fixture: tests/fixtures/law_015)"
