# law-014 — part of Architect's language specification.

id = "law-014"
title = "A language's file extension must be scannable wherever its extractor lives, from one shared source"
statement = "The file-inventory pass (which extensions are even walked and read off disk) must derive its extension list from the same tables the structural extractor registry (`structural::LANGUAGES`, `structural::KNOWN_UNSUPPORTED`) is built from, never a second hand-maintained list. A language present in the extractor registry but absent from the scan-time extension filter is silently unreachable through the real CLI/REST/MCP path even though every unit test for its extractor passes."
because = "Found 2026-09-01 while adding the C# structural extractor: `scan.rs` had its own separate `SRC_EXTS` constant gating which files were even walked, and it had never included `kt` — meaning the Kotlin top-level-function extractor added earlier in this same session was dead code through every real entry point (CLI, REST, MCP, the onboarding script) despite compiling cleanly and passing its own unit test. It only surfaced because a live end-to-end check against a real Kotlin file returned zero files_scanned, not because any test caught it — no test exercised the actual file-walk step for a language added after the original SRC_EXTS list was written. Two independent lists that must agree but are not the same list will eventually disagree; this is the same failure shape as the pre-existing root-discovery lesson (one resolver, not one per call site) applied to language extraction."
category = "parser"
discovered_in = ["architect's own repo — adding C# support surfaced that Kotlin, added earlier the same session, was unreachable"]
introduced = "2026-09-01"
status = "active"
regression = "tests/laws.rs::law_014_extractor_language_is_actually_scanned (fixture: tests/fixtures/law_014)"
