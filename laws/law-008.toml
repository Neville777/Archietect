# law-008 — part of Archietect's language specification.
# Laws are amended, not edited: a superseded law gets status = "superseded"
# and a supersedes pointer from its successor — semantics are versioned.

id = "law-008"
title = "Prose about schema is not schema (strings)"
statement = "A CREATE TABLE match must be followed by its column list `(` or AS — otherwise it is prose."
because = "redash: logger.debug(\"CREATE TABLE query: %s\") — a log message — minted the phantom that law-007 then had to out-rank. The follower requirement kills log/prose strings structurally, with no blacklist to maintain."
discovered_in = ["redash"]
introduced = "2026-08-05"
status = "active"
category = "parser"
# parser — the `(` follower requirement is a SQL lexer correctness rule.
# It lives in scan::extract_sql. The regression fixture is valuable;
# the rule belongs with the extractor, not the philosophical law registry.
# Note: law-003 and law-008 are siblings — both enforce "prose ≠ schema"
# at different syntactic positions (comment lines vs. string content).
regression = "tests/laws.rs::law_008 (fixture: tests/fixtures/law_008)"
