# law-010 — part of Architect's language specification.

id = "law-010"
title = "An alias target is an exact concept name, not a search term"
statement = "Any INTERNAL reference to a known concept — alias targets, composed queries passing canonical names — resolves by exact name first; term search is for human input only. Multi-token names match no single token of themselves, so feeding them through search silently loses them."
because = "TITAN declares theory = \"causal_hypotheses\" and got UNKNOWN: the target was fed back through token matching. Struck AGAIN same day in plan(): canonical names passed to owner()/impact() through term search returned null locations. The same disease in two organs earns the general statement."
discovered_in = ["TITAN"]
introduced = "2026-08-05"
status = "active"
category = "philosophy"
# philosophy — this is the companion to law-009 and equally irreducible.
# The human types a term; the engine searches. The engine passes a canonical
# name; the engine resolves exactly. That boundary — human input vs.
# internal reference — is an architectural principle, not a parser rule or
# ranking weight. It cannot be expressed as a constant or an invariant;
# it governs the contract between layers of the system.
