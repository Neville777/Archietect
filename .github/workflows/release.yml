name: Release

# Builds and attaches dependency-free binaries to a GitHub Release, and
# publishes to crates.io, whenever a version tag (v0.1.0, v1.2.3, ...) is
# pushed. Never runs on an ordinary push/PR — see ci.yml for that. Nothing
# here creates a tag on its own; cutting the first release is a decision
# for a human to make, not this workflow. The crates.io publish step
# no-ops with a warning if the CARGO_REGISTRY_TOKEN secret isn't set —
# that token has to come from a human's crates.io account, never assumed
# to exist.
on:
  push:
    tags:
      - "v*"

jobs:
  # Found the hard way, releasing v0.1.1: the git tag and Cargo.toml's own
  # `version` are two independent things that must agree but were never
  # checked against each other — Cargo.toml still said "0.1.0" when v0.1.1
  # was tagged, so the binary (and its MCP serverInfo.version) silently
  # reported the wrong version to everyone who ran it. Same failure shape as
  # law-014 (two lists that must agree, aren't the same list, will
  # eventually disagree) applied to release versioning — fail the whole
  # release fast, before spending build minutes on three platforms, rather
  # than publish a binary that lies about its own version.
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag must match Cargo.toml version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"(.*)"/\1/')"
          echo "tag=$TAG cargo.toml=$CARGO_VERSION"
          if [ "$TAG" != "$CARGO_VERSION" ]; then
            echo "::error::Tag v$TAG does not match Cargo.toml version $CARGO_VERSION — bump Cargo.toml before tagging."
            exit 1
          fi

  publish-crate:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN secret is not set — skipping crates.io publish. Add it in repo Settings > Secrets to enable this."
            exit 0
          fi
          cargo publish

  build:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: archietect-linux-x86_64
            # NOT -gnu: found by actually installing the v0.1.0 release on
            # a real machine (Ubuntu 22.04 LTS, glibc 2.35, still supported
            # until 2027 and extremely widely deployed) — the -gnu build
            # dynamically links against ubuntu-latest's glibc (24.04, 2.39)
            # and refuses to even start anywhere older: "GLIBC_2.39 not
            # found". musl statically links everything, including libc, so
            # the binary runs on any x86_64 Linux kernel regardless of
            # which glibc (if any) is installed. Standard fix for exactly
            # this class of bug in Rust CLI distribution.
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: archietect-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: archietect-macos-x86_64
            # Cross-compiled from the same Apple Silicon runner as the
            # arm64 build above, not built natively on an Intel runner.
            # GitHub has been shrinking Intel macOS (macos-13) capacity
            # hard enough that a job pinned to that label sat queued for
            # 25+ minutes with no runner ever assigned, found the first
            # time this workflow actually ran for a real tag. Cross-linking
            # x86_64-apple-darwin from an arm64 host via Xcode's linker is
            # standard, well-established practice — the resulting binary is
            # a real x86_64 Mach-O, not an emulated/translated one.
          # Windows is deliberately not included here: the daemon
          # (`archietect watch` via packaging/onboard.sh --daemon) only
          # knows systemd (Linux) and launchd (macOS) — see onboard.sh's
          # own `case "$(uname)"` — and the plain CLI binary has never
          # actually been built or run on Windows by anyone in this
          # project's history. Adding it to this matrix would ship an
          # artifact nobody has verified, not just one with a known gap.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl linker
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage artifact
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/archietect" "dist/${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  # Builds archietect-desktop (the native Tauri wrapper around the same
  # rest::serve() + ui/index.html every other transport already uses — see
  # desktop/src-tauri/src/lib.rs's own module doc) so other devs can just
  # download an installable app instead of every one of them needing a Rust
  # + Tauri toolchain on their own machine to run `cargo tauri build`
  # themselves. Deliberately its own job, not folded into `build` above:
  # the CLI's platform matrix is about a single static binary; this one is
  # about OS-native installer formats, which need OS-specific system
  # packages (webkit2gtk on Linux) and produce different file types per OS.
  #
  # Desktop's own Cargo.toml version is NOT checked against the tag the way
  # `check-version` checks the main crate's — desktop is a thin wrapper
  # released alongside the CLI, not a product with its own independent
  # version number a human is expected to bump every time. Its version
  # exists only because Tauri's config schema requires one.
  build-desktop:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            # Ubuntu 22.04, not -latest, for the same glibc-compatibility
            # reason the CLI build picks musl over -latest's newer glibc —
            # a .deb built against ubuntu-latest's glibc would refuse to
            # even install on the (extremely common) still-supported
            # older LTS this project already verified the CLI against.
            bundles: deb,rpm
            # AppImage bundling additionally downloads linuxdeploy and two
            # of its plugins at build time (not vendored, not cached) —
            # found running this exact build locally: one of those
            # downloads failed and took the whole bundle step down with it,
            # even though the .deb and .rpm right above it had already
            # built fine. A flaky third-party download shouldn't be able to
            # fail a release. .deb/.rpm cover Debian/Ubuntu and
            # Fedora/RHEL-family distros directly; AppImage can come back
            # later if someone actually needs the ones that aren't either.
          - platform: macos-latest
            bundles: dmg
            # Native (not cross-compiled) — macos-latest runners are Apple
            # Silicon, so this covers arm64 Macs only. The CLI's release
            # job cross-links an x86_64 target from the same kind of
            # runner (see its own comment above); desktop doesn't do that
            # yet, so Intel Mac users have no desktop build here until
            # someone adds it.
          - platform: windows-latest
            bundles: msi
            # Tauri's standard, well-supported target (WebView2 ships with
            # Windows 10/11; the bundler downloads WiX itself, no extra
            # install step needed) — but unlike the other two platforms,
            # nobody has actually run the resulting installer on a real
            # Windows machine. Standard != verified; flagging it here the
            # same way this file already flags the CLI's Windows gap.
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install Linux webview + bundler deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build desktop app
        working-directory: desktop
        run: cargo tauri build --bundles ${{ matrix.bundles }}

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p dist
          IFS=',' read -ra EXTS <<< "${{ matrix.bundles }}"
          for ext in "${EXTS[@]}"; do
            find "desktop/src-tauri/target/release/bundle" -type f -name "*.$ext" \
              -exec cp {} "dist/" \;
          done
          ls -la dist/

      - uses: actions/upload-artifact@v7
        with:
          name: archietect-desktop-${{ matrix.platform }}
          path: dist/*

  release:
    needs: [build, build-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Flatten artifacts
        run: |
          mkdir -p out
          find dist -type f -exec cp {} out/ \;
          ls -la out/

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
