name: Release

# Builds and attaches dependency-free binaries to a GitHub Release, and
# publishes to crates.io, whenever a version tag (v0.1.0, v1.2.3, ...) is
# pushed. Never runs on an ordinary push/PR — see ci.yml for that. Nothing
# here creates a tag on its own; cutting the first release is a decision
# for a human to make, not this workflow. The crates.io publish step
# no-ops with a warning if the CARGO_REGISTRY_TOKEN secret isn't set —
# that token has to come from a human's crates.io account, never assumed
# to exist.
on:
  push:
    tags:
      - "v*"

jobs:
  # Found the hard way, releasing v0.1.1: the git tag and Cargo.toml's own
  # `version` are two independent things that must agree but were never
  # checked against each other — Cargo.toml still said "0.1.0" when v0.1.1
  # was tagged, so the binary (and its MCP serverInfo.version) silently
  # reported the wrong version to everyone who ran it. Same failure shape as
  # law-014 (two lists that must agree, aren't the same list, will
  # eventually disagree) applied to release versioning — fail the whole
  # release fast, before spending build minutes on three platforms, rather
  # than publish a binary that lies about its own version.
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag must match Cargo.toml version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(grep -m1 '^version' Cargo.toml | sed -E 's/version *= *"(.*)"/\1/')"
          echo "tag=$TAG cargo.toml=$CARGO_VERSION"
          if [ "$TAG" != "$CARGO_VERSION" ]; then
            echo "::error::Tag v$TAG does not match Cargo.toml version $CARGO_VERSION — bump Cargo.toml before tagging."
            exit 1
          fi

  publish-crate:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN secret is not set — skipping crates.io publish. Add it in repo Settings > Secrets to enable this."
            exit 0
          fi
          cargo publish

  build:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: archietect-linux-x86_64
            # NOT -gnu: found by actually installing the v0.1.0 release on
            # a real machine (Ubuntu 22.04 LTS, glibc 2.35, still supported
            # until 2027 and extremely widely deployed) — the -gnu build
            # dynamically links against ubuntu-latest's glibc (24.04, 2.39)
            # and refuses to even start anywhere older: "GLIBC_2.39 not
            # found". musl statically links everything, including libc, so
            # the binary runs on any x86_64 Linux kernel regardless of
            # which glibc (if any) is installed. Standard fix for exactly
            # this class of bug in Rust CLI distribution.
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: archietect-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: archietect-macos-x86_64
            # Cross-compiled from the same Apple Silicon runner as the
            # arm64 build above, not built natively on an Intel runner.
            # GitHub has been shrinking Intel macOS (macos-13) capacity
            # hard enough that a job pinned to that label sat queued for
            # 25+ minutes with no runner ever assigned, found the first
            # time this workflow actually ran for a real tag. Cross-linking
            # x86_64-apple-darwin from an arm64 host via Xcode's linker is
            # standard, well-established practice — the resulting binary is
            # a real x86_64 Mach-O, not an emulated/translated one.
          # Windows is deliberately not included here: the daemon
          # (`archietect watch` via packaging/onboard.sh --daemon) only
          # knows systemd (Linux) and launchd (macOS) — see onboard.sh's
          # own `case "$(uname)"` — and the plain CLI binary has never
          # actually been built or run on Windows by anyone in this
          # project's history. Adding it to this matrix would ship an
          # artifact nobody has verified, not just one with a known gap.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl linker
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage artifact
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/archietect" "dist/${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  # Builds archietect-desktop (the native Tauri wrapper around the same
  # rest::serve() + ui/index.html every other transport already uses — see
  # desktop/src-tauri/src/lib.rs's own module doc) so other devs can just
  # download an installable app instead of every one of them needing a Rust
  # + Tauri toolchain on their own machine to run `cargo tauri build`
  # themselves. Deliberately its own job, not folded into `build` above:
  # the CLI's platform matrix is about a single static binary; this one is
  # about OS-native installer formats, which need OS-specific system
  # packages (webkit2gtk on Linux) and produce different file types per OS.
  #
  # Desktop's own Cargo.toml version is NOT checked against the tag the way
  # `check-version` checks the main crate's — desktop is a thin wrapper
  # released alongside the CLI, not a product with its own independent
  # version number a human is expected to bump every time. Its version
  # exists only because Tauri's config schema requires one.
  build-desktop:
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            artifact: archietect-desktop-linux-x86_64
            # Ubuntu 22.04, not -latest, for the same glibc-compatibility
            # reason the CLI build picks musl over -latest's newer glibc —
            # a .deb built against ubuntu-latest's glibc would refuse to
            # even install on the (extremely common) still-supported
            # older LTS this project already verified the CLI against.
            bundles: deb,rpm
            # AppImage is attempted separately below ("Build AppImage
            # (best-effort)") — NOT added to `bundles` here, deliberately.
            # It failed a full release once already (this matrix leg's
            # earlier comment history): linuxdeploy's download failed and
            # took the whole `cargo tauri build` down with it, and since
            # `release` requires every build-desktop leg to succeed, that
            # ONE optional format blocked .deb/.rpm/.dmg/.msi from
            # publishing too, for everyone. A retry (added, then tried
            # locally) didn't reproduce that specific failure again — it
            # hit a DIFFERENT one instead ("failed to run linuxdeploy",
            # unchanged even with linuxdeploy's own documented
            # APPIMAGE_EXTRACT_AND_RUN=1 fallback set), so a retry loop
            # alone isn't a trustworthy fix. AppImage bundling depends on
            # third-party binaries this project doesn't control (and,
            # apparently, environment-specific FUSE/execution behavior) —
            # the right fix isn't re-gambling that it works this time,
            # it's making sure it can NEVER again take the required
            # formats down with it if it doesn't.
          - platform: macos-latest
            bundles: dmg
            target: aarch64-apple-darwin
            artifact: archietect-desktop-macos-arm64
            # Native — macos-latest runners are Apple Silicon.
          - platform: macos-latest
            bundles: dmg
            target: x86_64-apple-darwin
            artifact: archietect-desktop-macos-x86_64
            # Cross-compiled from the same Apple Silicon runner as the
            # arm64 leg above, same standard Xcode-linker cross-link the
            # CLI's own release job already relies on (see its matrix
            # entry's comment above) — not a new technique, just applied
            # to the desktop bundle too so Intel Mac users get one.
          - platform: windows-latest
            bundles: msi
            artifact: archietect-desktop-windows-x86_64
            # Tauri's standard, well-supported target (WebView2 ships with
            # Windows 10/11; the bundler downloads WiX itself, no extra
            # install step needed) — but unlike the other two platforms,
            # nobody has actually run the resulting installer on a real
            # Windows machine. Standard != verified; flagging it here the
            # same way this file already flags the CLI's Windows gap.
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # libfuse2: AppImage's own runtime (and linuxdeploy, which builds it)
      # needs FUSE to mount the image it's assembling; GitHub's ubuntu-22.04
      # image doesn't carry it by default. Still installed even though
      # AppImage below is best-effort — it costs nothing on the legs that
      # don't need it (this whole step is Linux-only already) and it's a
      # real prerequisite for the one leg that does.
      - name: Install Linux webview + bundler deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf libfuse2

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      # `--target` only passed when the matrix leg sets one (the two macOS
      # legs, to pick which of the two Mach-O architectures Xcode's linker
      # produces) — an empty `--target ""` is not the same as omitting the
      # flag, so this branches instead of always interpolating it in.
      # Retried (not a plain `run:` step) for the same reason every step in
      # this job could reasonably want it: a transient CI hiccup shouldn't
      # cost a full rebuild-from-scratch when cargo/tauri only recompile
      # what changed anyway. This is the REQUIRED build (`matrix.bundles`
      # is deb,rpm/dmg/msi, never appimage — see AppImage's own separate
      # best-effort step below for why).
      - name: Build desktop app
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 3
          shell: bash
          working_directory: desktop
          command: |
            if [ -n "${{ matrix.target }}" ]; then
              cargo tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
            else
              cargo tauri build --bundles ${{ matrix.bundles }}
            fi

      # Best-effort, deliberately isolated from the required build above:
      # `continue-on-error: true` means this step's failure does NOT fail
      # the job, so a broken/flaky AppImage can never again take
      # deb/rpm/dmg/msi down with it (see the ubuntu-22.04 matrix entry's
      # own comment for the full history — that's a real thing that
      # already happened once). The binary is already built by the
      # required step above; this only re-runs the bundling itself.
      # Tried locally with a retry AND linuxdeploy's own documented
      # APPIMAGE_EXTRACT_AND_RUN=1 escape hatch — neither got past "failed
      # to run linuxdeploy" in this environment, a different failure than
      # the download flakiness that motivated the retry in the first
      # place. Left in anyway: cheap when it works, harmless when it
      # doesn't, and the retry still helps if the ORIGINAL failure mode
      # (a bad download) is what a real release run hits instead.
      - name: Build AppImage (best-effort)
        if: matrix.platform == 'ubuntu-22.04'
        continue-on-error: true
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 2
          shell: bash
          working_directory: desktop
          command: cargo tauri build --bundles appimage

      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p dist
          if [ -n "${{ matrix.target }}" ]; then
            BUNDLE_DIR="desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          else
            BUNDLE_DIR="desktop/src-tauri/target/release/bundle"
          fi
          IFS=',' read -ra EXTS <<< "${{ matrix.bundles }}"
          # appimage is ALWAYS attempted here too (not just when this leg's
          # own `bundles` lists it) — harmless everywhere else since
          # nothing will match, and picks up the best-effort step's output
          # on ubuntu-22.04 if it happened to succeed.
          EXTS+=("appimage")
          for ext in "${EXTS[@]}"; do
            # -iname: AppImage's own file extension is capitalized
            # ("Archietect_0.1.0_amd64.AppImage") — plain -name with the
            # lowercase "appimage" here would silently match nothing and
            # ship an empty artifact for that leg.
            find "$BUNDLE_DIR" -type f -iname "*.$ext" \
              -exec cp {} "dist/" \;
          done
          ls -la dist/

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  release:
    needs: [build, build-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Flatten artifacts
        run: |
          mkdir -p out
          find dist -type f -exec cp {} out/ \;
          ls -la out/

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
