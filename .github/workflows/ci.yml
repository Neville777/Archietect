name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - "**"

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      # Compile checks first so a build break fails fast, before we spend
      # time running anything.
      - name: cargo build (debug, for the test profile)
        run: cargo build --verbose

      - name: cargo build --release
        run: cargo build --release --verbose

      # tests/laws.rs: fast (~0.4s), self-contained, needs nothing external.
      # Always run.
      - name: Run law tests (tests/laws.rs)
        run: cargo test --test laws --verbose

      # Unit tests embedded in src/ (e.g. root::tests, structural::cs_tests).
      # Also self-contained.
      - name: Run library unit tests
        run: cargo test --lib --verbose

      # archietect ci: pipe the diff of this push/PR through the architectural
      # law engine. Catches duplicate concepts, schema collisions, and law
      # violations introduced by the change — the same check the pre-commit
      # hook runs locally, now enforced in CI so no commit can bypass it.
      # Runs after the build so the binary is guaranteed fresh.
      - name: Architectural gate (archietect ci)
        run: |
          git diff HEAD~1 HEAD | ./target/release/archietect ci

      # Exercise two representative real-world corpora on every CI run. The
      # complete corpus remains local-only because several repos are large.
      - name: Fetch invariant fixtures
        run: |
          mkdir -p validation
          git clone --depth 1 https://github.com/umami-software/umami.git validation/umami
          git clone --depth 1 https://github.com/getredash/redash.git validation/redash

      - name: Run representative invariant tests
        run: cargo test --test invariants invariants_umami invariants_redash --verbose

  # cargo fmt --check and cargo clippy are intentionally NOT part of the
  # required gate yet: as of the commit that introduced this workflow,
  # `cargo fmt --check` reports pre-existing formatting diffs (e.g.
  # src/invariants.rs, src/laws.rs, src/lib.rs, src/mcp.rs) and
  # `cargo clippy --release` reports ~11 pre-existing warnings (mostly in
  # src/structural.rs: type_complexity, regex_creation_in_loops, etc.),
  # none introduced by this change. Turning either on now would make CI red
  # on day one for reasons outside this task's scope. Once those are
  # cleaned up, add jobs here running `cargo fmt --check` and
  # `cargo clippy --release -- -D warnings`.

  # Publishing to crates.io is handled exclusively by release.yml, which
  # fires only on v* tags. Having a second publish job here caused double-
  # publish errors when a tag push triggered both workflows simultaneously.
